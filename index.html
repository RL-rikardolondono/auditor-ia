<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Auditor-IA — Auditoría integral de contratos, proyectos, recursos y ciberseguridad para entidades públicas y privadas. SkyNet Genesis.">
<meta name="theme-color" content="#0B4F8A">
<title>Auditor-IA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E3A4C'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23E0A21A'/%3E%3Ccircle cx='16' cy='7' r='2.6' fill='%23E0A21A'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: panel de auditoría con ingreso, roles y menús por rol. Solo modo claro.
     Color: identidad SkyNet Genesis. Type: Barlow Condensed (títulos) + Public Sans (texto). */
  :root{
    --azul:#0B4F8A;--azul2:#1867B0;--verde:#14A38B;--verde-osc:#0E8571;--whatsapp:#1F8A4C;--ambar:#E0A21A;
    --bg:#F4F8FB;--surface:#FFFFFF;--texto:#1C2B39;--suave:#5D6B78;--borde:#DCE5EE;--azul-suave:#E8F1FA;--verde-suave:#E3F6F2;
    --rojo:#C0392B;--rojo-bg:#FBE6E3;--naranja:#D35400;--naranja-bg:#FBE9D9;--amarillo:#B9820B;--amarillo-bg:#FBF1D8;--ok:#1F8A4C;--ok-bg:#E3F6EC;
    --r:14px;--r-sm:9px;--sombra:0 1px 3px rgba(11,79,138,.07),0 6px 20px rgba(11,79,138,.06);color-scheme:light;
    --f-tit:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--f-txt:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--texto);font-family:var(--f-txt);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--f-tit);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.2px}
  button{font-family:inherit}
  .num{font-variant-numeric:tabular-nums}
  #login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .login-card{background:var(--surface);border:1px solid var(--borde);border-radius:20px;box-shadow:var(--sombra);max-width:450px;width:100%;padding:28px 26px 24px;text-align:center}
  .login-card .logo-big{width:70px;height:70px;margin:0 auto 8px;display:block}
  .login-card h1{font-size:40px;color:var(--azul);letter-spacing:.5px}
  .login-card .ia{color:var(--verde)}
  .tagline{color:var(--suave);font-size:14.5px;margin:6px 0 20px}
  .field{text-align:left;margin-bottom:13px}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--suave);margin-bottom:5px}
  select,input,textarea{width:100%;padding:11px 12px;border:1px solid var(--borde);border-radius:var(--r-sm);background:#fff;color:var(--texto);font-size:15px;font-family:inherit;color-scheme:light;accent-color:var(--verde)}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--azul2);outline-offset:0;border-color:var(--azul2)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r-sm);padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;transition:filter .15s,transform .05s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;width:100%}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-verde{background:var(--verde);color:#fff}.btn-verde:hover{background:var(--verde-osc)}
  .btn-ghost{background:#fff;color:var(--azul);border:1px solid var(--borde)}.btn-ghost:hover{background:var(--azul-suave)}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
  .roles-info{text-align:left;font-size:12px;color:var(--suave);background:var(--azul-suave);border-radius:10px;padding:10px 12px;margin-top:4px}
  .roles-info b{color:var(--azul)}
  .demo-note{margin-top:14px;font-size:12.5px;color:var(--suave);background:var(--verde-suave);border-radius:10px;padding:10px 12px}
  .demo-note b{color:var(--verde-osc)}
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#fff;box-shadow:0 1px 0 var(--borde),0 2px 10px rgba(11,79,138,.05);display:flex;align-items:center;gap:12px;padding:10px 16px}
  .brand{display:flex;align-items:center;gap:11px}
  .topbar svg{width:34px;height:34px;flex:none}
  .bt{font-family:var(--f-tit);font-weight:700;line-height:.92;font-size:15px}
  .bt .g{color:var(--ambar)}.bt .s{color:var(--azul)}
  .topbar .spacer{flex:1}
  .who{display:flex;flex-direction:column;align-items:flex-end;gap:1px;max-width:52vw}
  .who .emp{font-size:13px;font-weight:700;color:var(--azul);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
  .who .rol{font-size:11px;color:var(--suave)}
  .link-salir{background:none;border:none;color:var(--suave);font-size:13px;cursor:pointer;font-weight:600;flex:none}.link-salir:hover{color:var(--rojo)}
  .hamb{display:none;background:none;border:1px solid var(--borde);border-radius:8px;width:38px;height:38px;font-size:20px;color:var(--azul);cursor:pointer;flex:none;align-items:center;justify-content:center}
  .shell{display:flex;align-items:flex-start;max-width:1140px;margin:0 auto}
  .side{width:234px;flex:none;background:#fff;border-right:1px solid var(--borde);position:sticky;top:calc(55px + env(safe-area-inset-top,0px));height:calc(100dvh - 55px - env(safe-area-inset-top,0px));overflow-y:auto;padding:8px 10px 40px;scrollbar-width:thin}
  .side .grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--suave);padding:14px 10px 6px}
  .side .item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;text-align:left;padding:9px 11px;border-radius:10px;font-size:14px;font-weight:600;color:var(--texto);cursor:pointer;margin-bottom:2px}
  .side .item .ico{width:26px;height:26px;border-radius:7px;background:var(--azul-suave);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .side .item:hover{background:var(--azul-suave)}
  .side .item.active{background:var(--verde-suave);color:var(--verde-osc)}
  .side .item.active .ico{background:var(--verde);color:#fff}
  .wrap{flex:1;min-width:0;max-width:860px;margin:0;padding:18px 16px 80px}
  .ovl{display:none}
  @media(max-width:820px){
    .hamb{display:flex}
    .shell{display:block}
    .side{position:fixed;left:0;top:0;width:264px;height:100dvh;z-index:60;transform:translateX(-100%);transition:transform .22s;box-shadow:0 10px 40px rgba(0,0,0,.28);padding-top:16px}
    body.menu .side{transform:none}
    body.menu .ovl{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  }
  .view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .view-head h2{font-size:27px;color:var(--azul)}
  .view-head p{margin:2px 0 0;color:var(--suave);font-size:13.5px;max-width:62ch}
  .fuente{background:var(--azul-suave);border:1px solid #cfe0f2;border-radius:10px;padding:9px 13px;font-size:12.5px;color:var(--azul);margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
  .fuente svg{width:16px;height:16px;flex:none;margin-top:1px}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .card{background:var(--surface);border:1px solid var(--borde);border-radius:var(--r);box-shadow:var(--sombra)}
  .kpi{padding:16px}
  .kpi .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--suave)}
  .kpi .val{font-family:var(--f-tit);font-weight:700;font-size:34px;margin-top:3px;line-height:1}
  .kpi .sub{font-size:12.5px;color:var(--suave);margin-top:3px}
  .kpi.s-rojo{background:var(--rojo-bg);border-color:#F3C9C3}.kpi.s-rojo .val{color:var(--rojo)}
  .kpi.s-naranja .val{color:var(--naranja)}.kpi.s-amarillo .val{color:var(--amarillo)}.kpi.s-ok .val{color:var(--ok)}.kpi.s-azul .val{color:var(--azul)}
  .panel{padding:16px}
  .panel h3{font-size:19px;margin-bottom:3px}
  .panel .sub{font-size:13px;color:var(--suave);margin-bottom:12px}
  .semaforo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .sem-circle{width:74px;height:74px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-tit);font-weight:700;font-size:30px;color:#fff;box-shadow:inset 0 -4px 10px rgba(0,0,0,.12)}
  .sem-rojo{background:var(--rojo)}.sem-naranja{background:var(--naranja)}.sem-amarillo{background:var(--ambar)}.sem-ok{background:var(--ok)}
  .sem-txt b{font-family:var(--f-tit);font-size:20px}
  .sem-txt p{margin:2px 0 0;color:var(--suave);font-size:13.5px;max-width:52ch}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .b-rojo{background:var(--rojo-bg);color:var(--rojo)}.b-naranja{background:var(--naranja-bg);color:var(--naranja)}.b-amarillo{background:var(--amarillo-bg);color:var(--amarillo)}.b-ok{background:var(--ok-bg);color:var(--ok)}.b-info{background:var(--azul-suave);color:var(--azul)}
  .luz{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.08)}
  .l-rojo{background:var(--rojo)}.l-naranja{background:var(--naranja)}.l-amarillo{background:var(--ambar)}.l-ok{background:var(--ok)}
  .luces{display:inline-flex;gap:4px;vertical-align:middle}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--borde);border-radius:var(--r);background:#fff}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
  thead th{background:var(--azul-suave);color:var(--azul);text-align:left;font-weight:700;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  tbody td{padding:10px 12px;border-top:1px solid var(--borde);vertical-align:middle}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover{background:var(--azul-suave)}
  td.r,th.r{text-align:right}
  .bar{height:9px;border-radius:5px;background:var(--borde);overflow:hidden;margin:3px 0}
  .bar>i{display:block;height:100%;border-radius:5px}
  .bar .fis{background:var(--azul)}.bar .fin{background:var(--ambar)}
  .alert-row{display:flex;gap:12px;padding:13px 15px;border-top:1px solid var(--borde);align-items:flex-start}
  .alert-row:first-child{border-top:none}
  .alert-row .ic{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px}
  .ic-rojo{background:var(--rojo-bg)}.ic-naranja{background:var(--naranja-bg)}.ic-amarillo{background:var(--amarillo-bg)}.ic-ok{background:var(--ok-bg)}
  .alert-row .bd{flex:1;min-width:0}
  .alert-row .bd b{font-size:14.5px}
  .alert-row .bd p{margin:2px 0 0;color:var(--suave);font-size:13px}
  .alert-row .meta{font-size:11.5px;color:var(--suave);margin-top:5px}
  .seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:flex-end;background:var(--bg);border-radius:10px;padding:11px}
  .seg .field{margin:0;flex:1;min-width:120px}
  .seg .field label{font-size:11px;margin-bottom:3px}
  .seg select,.seg input{padding:8px 9px;font-size:13px}
  .seg .acc{flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
  .est-tag{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
  .checklist{list-style:none;margin:0;padding:0}
  .checklist li{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-top:1px solid var(--borde)}
  .checklist li:first-child{border-top:none}
  .chk{width:24px;height:24px;border-radius:6px;flex:none;border:2px solid var(--azul);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;background:#fff;color:#fff;font-weight:700}
  .chk.on{background:var(--ok);border-color:var(--ok)}
  .checklist .ct{flex:1;min-width:0;font-size:14px}
  .checklist .ct small{display:block;color:var(--suave);font-size:12px}
  .req{color:var(--rojo);font-weight:700}
  .ficha{border-top:1px solid var(--borde);padding:13px 4px}
  .ficha:first-child{border-top:none}
  .ficha .cab{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
  .ficha .cab b{font-size:14.5px}
  .ficha .ced{font-size:12px;color:var(--suave)}
  .mini{font-size:12.5px;color:var(--suave);margin-top:6px}
  .mini .it{display:flex;gap:8px;align-items:center;padding:3px 0}
  .cyberq{border-top:1px solid var(--borde);padding:12px 4px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
  .cyberq:first-child{border-top:none}
  .cyberq .q{flex:1;min-width:200px;font-size:14px}
  .cyberq .q small{display:block;color:var(--suave);font-size:11.5px;margin-top:2px}
  .cyberq select{width:auto;min-width:120px}
  .det dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
  .det dt{color:var(--suave);font-weight:600}
  .det dd{margin:0;font-weight:600}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-grid .full{grid-column:1/-1}
  @media(max-width:520px){.form-grid{grid-template-columns:1fr}}
  .informe{background:#fff;border:1px solid var(--borde);border-radius:var(--r);box-shadow:var(--sombra);padding:26px 24px}
  .informe .doc-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--azul);padding-bottom:14px;margin-bottom:16px}
  .informe h3{font-size:22px;color:var(--azul)}
  .informe .rol-line{color:var(--suave);font-size:13px}
  .aviso-legal{background:var(--amarillo-bg);border:1px solid #EAD9A6;border-radius:10px;padding:11px 14px;font-size:12.5px;margin-bottom:16px;color:#6b5207}
  .informe section{margin-bottom:16px}
  .informe section h4{font-size:16px;color:var(--verde-osc);border-left:4px solid var(--verde);padding-left:9px;margin-bottom:8px}
  .informe ul{margin:0;padding-left:20px;font-size:14px}.informe li{margin-bottom:5px}
  .doc-foot{margin-top:20px;border-top:1px solid var(--borde);padding-top:12px;font-size:12px;color:var(--suave);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .doc-foot svg{width:22px;height:22px}
  .pay-state{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px;border-radius:var(--r)}
  .pay-activa{background:var(--ok-bg)}.pay-aviso{background:var(--amarillo-bg)}.pay-cerrada{background:var(--rojo-bg)}
  .pay-state .big{font-family:var(--f-tit);font-weight:700;font-size:24px}
  .llave-box{background:var(--azul-suave);border-radius:var(--r);padding:16px;margin-top:14px}
  .llave-box .kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
  .llave-box .kv b{font-family:var(--f-tit);font-size:16px;color:var(--azul)}
  .row-inline{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row-inline .field{margin-bottom:0}
  .bit-row{display:flex;gap:10px;padding:9px 4px;border-top:1px solid var(--borde);font-size:13px;align-items:baseline}
  .bit-row:first-child{border-top:none}
  .bit-row time{color:var(--suave);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--whatsapp);color:#fff;border:none;border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(31,138,76,.4);cursor:pointer;display:flex;gap:8px;align-items:center}
  .fab:hover{filter:brightness(1.07)}
  /* Aviso de confirmación: azul, grande y visible (no negro pequeño) */
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;padding:14px 22px;border-radius:14px;font-size:15px;font-weight:700;z-index:60;box-shadow:0 10px 30px rgba(11,79,138,.4);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:92vw;text-align:center;display:flex;gap:9px;align-items:center}
  .toast svg{width:20px;height:20px;flex:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .toast.t-ok{background:linear-gradient(135deg,var(--verde),var(--verde-osc))}
  .toast.t-err{background:linear-gradient(135deg,var(--rojo),#9b2d20);box-shadow:0 10px 30px rgba(192,57,43,.4)}
  .muted{color:var(--suave)}.mt{margin-top:14px}.mb{margin-bottom:14px}
  .addon{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--verde-osc);background:var(--verde-suave);padding:3px 9px;border-radius:999px}
  @media(max-width:520px){.login-card h1{font-size:34px}.wrap{padding:14px 14px 84px}.view-head h2{font-size:23px}}
  .linkbtn{background:none;border:none;color:var(--azul2);font-weight:700;cursor:pointer;padding:0;font-size:inherit;font-family:inherit;text-decoration:underline}
  .linkbtn:hover{color:var(--azul)}
  @media print{
    body.imprimiendo .topbar,body.imprimiendo .side,body.imprimiendo .fab,body.imprimiendo .toast,body.imprimiendo .ovl,body.imprimiendo .no-print,body.imprimiendo .view-head{display:none!important}
    body.imprimiendo .shell,body.imprimiendo .wrap{display:block!important;margin:0!important;padding:0!important}
    body.imprimiendo{background:#fff}
    body.imprimiendo .informe{box-shadow:none!important;border:none!important;margin:0!important}
    @page{margin:14mm}
  }
</style>
</head>
<body>

<!-- ================= INGRESO ================= -->
<div id="login">
  <div class="login-card">
    <svg class="logo-big" viewBox="0 0 200 200" aria-hidden="true"><rect x="4" y="4" width="192" height="192" rx="46" fill="#1E3A4C"/><g stroke="#FFFFFF" stroke-linecap="round"><polygon points="100,42 150.2,71 150.2,129 100,158 49.8,129 49.8,71" fill="none" stroke-opacity=".35" stroke-width="4"/><path d="M100 100L100 42M100 100L150.2 71M100 100L150.2 129M100 100L100 158M100 100L49.8 129M100 100L49.8 71" stroke-width="6"/></g><g fill="#FFFFFF"><circle cx="150.2" cy="71" r="10"/><circle cx="150.2" cy="129" r="10"/><circle cx="100" cy="158" r="10"/><circle cx="49.8" cy="129" r="10"/><circle cx="49.8" cy="71" r="10"/></g><circle cx="100" cy="42" r="13" fill="#E0A21A"/><circle cx="100" cy="100" r="20" fill="#E0A21A"/></svg>
    <h1>Auditor<span class="ia">-IA</span></h1>
    <p class="tagline">Auditoría integral de contratos, proyectos, recursos y ciberseguridad. Detecta patrones y enciende alertas para que la plata no se pierda ni se desvíe.</p>
    <div id="authBox"><div class="field" style="text-align:center;color:var(--suave)">Cargando…</div></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" hidden>

function flagsDe(c){var f=[],p=proyectos[c.id];

 else if(c.otrosi===1)f.push({bid:'otrosi',sev:'amarillo',tipo:'Modificaciones',txt:'1 otrosí registrado.'});

 return f;

 crucesContratista().forEach(function(x){if(x.items.length>1&&x.enAlerta>0)h.push({bid:'concentracion',sev:x.sev==='rojo'?'rojo':'naranja',tit:'Mismo contratista en varios contratos — '+x.nombre,desc:'NIT '+x.nit+' aparece en '+x.items.length+' contratos, '+x.enAlerta+' con alerta.',meta:'Contratos: '+x.items.map(function(i){return i.c.id;}).join(', ')});});
 omisionesInterventor().forEach(function(x){h.push({bid:'interventor',sev:'rojo',tit:'Posible omisión del interventor — '+x.nombre,desc:'El interventor (CC '+x.ced+') aprobó '+x.omitidos.length+' contrato(s) pese a tener alertas.',meta:'Contratos: '+x.omitidos.map(function(i){return i.c.id;}).join(', ')});});

 hallazgosCyber().forEach(function(x){h.push(x);});
 var fr={};contratos.forEach(function(c){if(/directa/i.test(c.modalidad||'')&&!/prestaci/i.test(c.tcont||'')){var g=fr[c.nitCont]=fr[c.nitCont]||{nombre:c.contratista,nit:c.nitCont,ids:[],total:0};g.ids.push(c.id);g.total+=c.valor;}});
 Object.keys(fr).forEach(function(k){var x=fr[k];if(x.ids.length>=3)h.push({bid:'fraccionamiento',sev:'naranja',tit:'Posible fraccionamiento — '+x.nombre,desc:x.ids.length+' contratos por contratación directa al mismo contratista (NIT '+x.nit+'), que suman '+fmt(x.total)+'. Verificar si debió ser un solo proceso con licitación.',meta:'Contratos: '+x.ids.join(', ')});});

 h.forEach(function(x){x.key=slug(x.tit);});

 return h;
}

 try{var hs=await q(N().from('hallazgo_seg').select('*').eq('entidad_id',ENTIDAD_ID));(hs||[]).forEach(function(r){seg[r.clave]={estado:r.estado,resp:r.responsable||'',fecha:r.fecha_limite||'',nota:r.nota||'',por:'',_uuid:r.id};});}catch(e){console.warn('hallazgos',e);}

 try{var pl=await q(N().from('plan_auditoria').select('*').eq('entidad_id',ENTIDAD_ID).order('creado'));planAnual=(pl||[]).map(function(r){return {_uuid:r.id,anio:r.anio,tema:r.tema,riesgo:r.riesgo,periodo:r.periodo||'',responsable:r.responsable||'',estado:r.estado};});}catch(e){console.warn('plan',e);}

  log('Importó '+filas.length+' contratos ('+origen+')');toast('✓ '+filas.length+' contratos importados ('+origen+'). Ajuste el avance físico de las obras en Proyectos.');ir('contratos');return;
 }
 try{
  var ins=[];
  for(var i=0;i<filas.length;i+=100){
   var parte=filas.slice(i,i+100).map(function(f){var db={entidad_id:ENTIDAD_ID};COLS_CONTRATO.forEach(function(k){if(f[k]!==undefined&&f[k]!==null&&f[k]!=='')db[k]=f[k];});return db;});
   var r=await q(N().from('contrato').insert(parte).select());ins=ins.concat(r||[]);
  }

  var proy=[];ins.forEach(function(r){var f=byCod[r.codigo]||{};if(crearProyectoDe(f)&&(+r.valor)>0){var fin=Math.round((+r.ejecutado||0)/(+r.valor)*100);var fis=(f.__fis!=null?f.__fis:fin);proy.push({entidad_id:ENTIDAD_ID,contrato_id:r.id,nombre:(r.objeto||'').slice(0,60),fisico:fis,financiero:fin,presupuesto:+r.valor});}});
  for(var j=0;j<proy.length;j+=100){await q(N().from('proyecto').insert(proy.slice(j,j+100)).select());}
  log('Importó '+ins.length+' contratos ('+origen+')');
  await cargarDatos();toast('✓ '+ins.length+' contratos importados ('+origen+'). Ajuste el avance físico de las obras en Proyectos.');ir('contratos');
 }catch(e){toast('No se pudo importar: '+trad(e),'error');}
}
function plantillaCsv(){var h='codigo,objeto,contratista,nit,interventor,ced_interventor,ordenador,valor,ejecutado,fin,poliza,anticipo,fisico\n';var ej='C-2026-001,Construccion de parque,Constructora Ejemplo SAS,900123456,Laura Perez,22333444,Juan Gomez,150000000,60000000,2026-12-31,si,0,30\n';var blob=new Blob(["﻿"+h+ej],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='plantilla-auditor-ia.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(a.href);},1500);toast('Plantilla descargada');}
function onCsvFile(ev){var f=ev.target.files&&ev.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var filas=parseCSV(String(rd.result));if(!filas.length){document.getElementById('csvRes').innerHTML='<div class="card panel" style="background:var(--amarillo-bg);border-color:#EAD9A6">No se leyeron filas válidas. Revise que tenga las columnas y que código, objeto, contratista y valor estén llenos.</div>';return;}window.__csv=filas;document.getElementById('csvRes').innerHTML='<div class="pay-state" style="background:var(--verde-suave);color:var(--texto)"><div class="big" style="color:var(--verde-osc)">'+filas.length+' filas leídas</div></div><div class="mt"><button class="btn btn-verde" onclick="importarCsv()">Importar '+filas.length+' contratos</button></div>';}catch(e){document.getElementById('csvRes').innerHTML='<div class="card panel" style="background:var(--rojo-bg);border-color:#E7B7B0">No se pudo leer el CSV: '+esc(e.message||String(e))+'</div>';}};rd.readAsText(f,'utf-8');ev.target.value='';}
function parseCSV(txt){
 txt=txt.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
 var rows=[],row=[],cur='',qq=false;
 for(var i=0;i<txt.length;i++){var ch=txt[i];
  if(qq){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else qq=false;}else cur+=ch;}
  else{if(ch==='"')qq=true;else if(ch===',')  {row.push(cur);cur='';}else if(ch===';'&&row.length===0&&rows.length===0){row.push(cur);cur='';}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else cur+=ch;}
 }
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 if(rows.length<2)return [];
 var norm=function(s){return String(s||'').trim().toLowerCase().replace(/[áä]/g,'a').replace(/[éë]/g,'e').replace(/[íï]/g,'i').replace(/[óö]/g,'o').replace(/[úü]/g,'u');};
 var head=rows[0].map(norm);
 var idx=function(names){for(var k=0;k<names.length;k++){var p=head.indexOf(names[k]);if(p>=0)return p;}return -1;};
 var M={codigo:idx(['codigo','contrato','referencia']),objeto:idx(['objeto','descripcion']),contratista:idx(['contratista','proveedor']),nit:idx(['nit','nit_contratista','documento','cedula']),interv:idx(['interventor','supervisor']),cedint:idx(['ced_interventor','cedint','cedula_interventor']),orden:idx(['ordenador','ordenador_del_gasto']),valor:idx(['valor','valor_del_contrato']),ejec:idx(['ejecutado','pagado','valor_pagado']),fin:idx(['fin','fecha_fin','terminacion']),pol:idx(['poliza','tiene_poliza']),ant:idx(['anticipo']),fis:idx(['fisico','avance_fisico'])};
 var out=[],num=function(s){s=String(s==null?'':s).replace(/[^\d.,-]/g,'');if(!s)return 0;var neg=/-/.test(s);s=s.replace(/-/g,'');if(s.indexOf(',')>=0){s=s.replace(/\./g,'').replace(/,/g,'.');}else if(s.indexOf('.')>=0){var p=s.split('.');var miles=p.slice(1).every(function(z){return z.length===3;});if(p[0]!=='0'&&p[0]!==''&&miles)s=p.join('');}var n=parseFloat(s)||0;return neg?-n:n;};
 for(var r2=1;r2<rows.length;r2++){var c=rows[r2];if(!c.length||c.join('').trim()==='')continue;
  var g=function(k){return M[k]>=0?String(c[M[k]]||'').trim():'';};
  var cod=g('codigo'),obj=g('objeto'),con=g('contratista'),val=num(g('valor'));
  if(!cod||!obj||!con||!val)continue;
  var o={codigo:cod,objeto:obj.slice(0,500),contratista:con,nit_contratista:g('nit')||'—',interventor:g('interv'),ced_interventor:g('cedint'),ordenador:g('orden'),valor:val,ejecutado:num(g('ejec')),fin:(g('fin')||'').slice(0,10)||null,tiene_poliza:/^(si|sí|s|true|1|x|verdadero)$/i.test(g('pol')),anticipo:num(g('ant')),fuente:'csv',tipo:'Obra'};
  if(M.fis>=0&&g('fis')!=='')o.__fis=Math.max(0,Math.min(100,num(g('fis'))));
  out.push(o);
 }
 return out;
}
async function importarCsv(){var filas=window.__csv||[];if(!filas.length){toast('Primero cargue un archivo.');return;}var ya={};contratos.forEach(function(c){ya[c.id]=1;});var nuevos=filas.filter(function(f){return !ya[f.codigo];});if(!nuevos.length){toast('Esos contratos ya están cargados.');return;}await insertarContratos(nuevos,'CSV');}

function redesData(){

 contratos.forEach(function(c){var k=(c.cedRep&&c.cedRep!=='—')?c.cedRep:null;if(!k)return;var g=porRep[k]=porRep[k]||{rep:c.repLegal,ced:c.cedRep,contratistas:{},ids:[],total:0};g.contratistas[c.nitCont]=c.contratista;g.ids.push(c.id);g.total+=c.valor;});
 var reps=Object.keys(porRep).map(function(k){var g=porRep[k];g.nContratistas=Object.keys(g.contratistas).length;return g;}).filter(function(g){return g.nContratistas>=2||g.ids.length>=3;}).sort(function(a,b){return b.total-a.total;});
 var vinc=[];contratos.forEach(function(c){if(c.cedRep&&c.cedRep!=='—'&&(c.cedRep===c.cedInt||c.cedRep===c.cedOrd))vinc.push(c);});
 return {reps:reps,vinc:vinc};
}

async function quitarPlan(id){
 if(DEMO){planAnual=planAnual.filter(function(x){return x._uuid!==id;});toast('Quitado');repintar();return;}
 try{await q(N().from('plan_auditoria').delete().eq('id',id));planAnual=planAnual.filter(function(x){return x._uuid!==id;});toast('Quitado');repintar();}catch(e){toast('No se pudo: '+trad(e),'error');}
}

/* ---------- Multientidad (consolidado) ---------- */
var MULTI=null;
RENDER.multientidad=function(){
 if(!(SUPER||EMPRESA.alcance==='varias')){
  return '<div class="view-head"><div><h2>Multientidad</h2><p>Vista consolidada para órganos de control que vigilan varias entidades.</p></div></div>'+fuente('Esta vista es para contralorías, personerías u oficinas que auditan <b>varias entidades</b>. Su cuenta está configurada para una sola; si audita varias, actívelo en Parametrización → Alcance.')+'<div class="card panel"><p class="muted">Sin entidades adicionales para consolidar.</p></div>';
 }
 if(MULTI===null){cargarMultientidad();return '<div class="view-head"><div><h2>Multientidad</h2></div></div><div class="card panel"><p class="sub">Cargando entidades…</p></div>';}
 var tot=MULTI.reduce(function(s,e){return s+e.valor;},0);
 var rows=MULTI.map(function(e){return '<tr><td><b>'+esc(e.nombre)+'</b><br><small class="muted">'+esc(e.tipo||'')+'</small></td><td class="num">'+e.n+'</td><td class="r num">'+fmt(e.valor)+'</td><td class="r num">'+(e.riesgo?fmt(e.riesgo):'$0')+'</td></tr>';}).join('');
 return '<div class="view-head"><div><h2>Multientidad — consolidado</h2><p>Todas las entidades que usted vigila, en una sola mirada.</p></div></div>'+
  fuente('Consolida los contratos de todas las entidades a las que usted tiene acceso. El "en riesgo" es el valor pagado por encima del avance en cada entidad.')+
  '<div class="grid kpis mb">'+kpi('azul',MULTI.length,'Entidades vigiladas','')+kpi('verde',MULTI.reduce(function(s,e){return s+e.n;},0),'Contratos','en total')+kpi('azul',fmt(tot),'Valor consolidado','')+'</div>'+
  '<div class="tbl-wrap"><table><thead><tr><th>Entidad</th><th>Contratos</th><th class="r">Valor</th><th class="r">En riesgo</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
};
async function cargarMultientidad(){
 if(DEMO){MULTI=[{nombre:EMPRESA.nombre,tipo:EMPRESA.tipo,n:contratos.length,valor:contratos.reduce(function(s,c){return s+c.valor;},0),riesgo:0}];repintar();return;}
 try{
  var ents=await q(N().from('entidad').select('*'));ents=ents||[];
  var cs=await q(N().from('contrato').select('entidad_id,valor,ejecutado'));cs=cs||[];
  var ps=await q(N().from('proyecto').select('entidad_id,fisico,financiero,presupuesto'));ps=ps||[];
  var agg={};ents.forEach(function(e){agg[e.id]={nombre:e.nombre,tipo:e.tipo,n:0,valor:0,riesgo:0};});
  cs.forEach(function(c){var a=agg[c.entidad_id];if(a){a.n++;a.valor+=(+c.valor||0);}});
  ps.forEach(function(p){var a=agg[p.entidad_id];if(a){var d=(p.financiero-p.fisico);if(d>=12)a.riesgo+=Math.round((+p.presupuesto||0)*d/100);}});
  MULTI=Object.keys(agg).map(function(k){return agg[k];}).sort(function(a,b){return b.valor-a.valor;});
  repintar();
 }catch(e){MULTI=[];repintar();}
}
</script>
